spring:
  application:
    name: hiikky-admin-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hiikky_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
